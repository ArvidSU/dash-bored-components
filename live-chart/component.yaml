schemaVersion: 3
apiVersion: "1.0.0"
id: core/live-chart
name: Live chart
description: Polls a JSON endpoint and plots its chart-shaped response.
entry: ./index.js
types: ./index.d.ts
propsSchema:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
    type:
      enum:
        - line
        - bar
    maxPoints:
      type: integer
      minimum: 2
      maximum: 200
    endpoint:
      type: string
      pattern: ^(https?://|/|\./)
    dataPath:
      type: string
    pollIntervalMs:
      type: integer
      minimum: 1000
      maximum: 300000
  required:
    - endpoint
permissions:
  - network:http
actions:
  - id: refresh
    label: Refresh chart
    description: Reload the live chart endpoint.
