schemaVersion: 3
apiVersion: "1.0.0"
id: core/markdown
name: Markdown
description: Previews safe Markdown from inline content or a project file, with
  raw editing and bounded source polling.
entry: ./index.js
types: ./index.d.ts
propsSchema:
  type: object
  additionalProperties: false
  properties:
    content:
      type: string
    path: &a1
      type: string
      minLength: 1
    title:
      type: string
    source:
      type: object
      additionalProperties: false
      properties:
        shell: *a1
        file: *a1
        http:
          type: string
          pattern: ^https?://
        process: *a1
        inline: {}
        every:
          type: integer
          minimum: 1000
          maximum: 300000
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
        cwd:
          type: string
          minLength: 1
        env:
          type: object
          additionalProperties:
            type: string
      oneOf:
        - required:
            - shell
        - required:
            - file
        - required:
            - http
        - required:
            - process
        - required:
            - inline
  oneOf:
    - required:
        - content
    - required:
        - path
    - required:
        - source
permissionsByProp:
  path:
    - filesystem:read
    - filesystem:write
  source.shell:
    - process:execute
  source.file:
    - filesystem:read
  source.http:
    - network:http
  source.process:
    - process:observe
actions:
  - id: refresh
    label: Refresh Markdown
    description: Reload the configured Markdown source.
  - id: edit
    label: Edit Markdown
  - id: preview
    label: Preview Markdown
  - id: save
    label: Save Markdown edits
  - id: cancel
    label: Discard Markdown edits
references:
  source.process:
    resource: process
