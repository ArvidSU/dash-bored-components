schemaVersion: 3
apiVersion: "1.0.0"
id: core/status
name: Status
description: Displays a labeled state, with optional bounded sources emitting {
  state, detail?, trend?, segments? } or a supervised process snapshot.
  Source-backed states mark the last change seen while mounted.
entry: ./index.js
types: ./index.d.ts
propsSchema:
  type: object
  additionalProperties: false
  properties:
    label: &a1
      type: string
      minLength: 1
    state:
      enum:
        - unknown
        - healthy
        - warning
        - error
    detail:
      type: string
    density:
      enum:
        - comfortable
        - compact
      default: comfortable
    source:
      type: object
      additionalProperties: false
      properties:
        shell: *a1
        file: *a1
        http:
          type: string
          pattern: ^https?://
        process: *a1
        inline: {}
        every:
          type: integer
          minimum: 1000
          maximum: 300000
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
        cwd:
          type: string
          minLength: 1
        env:
          type: object
          additionalProperties:
            type: string
      oneOf:
        - required:
            - shell
        - required:
            - file
        - required:
            - http
        - required:
            - process
        - required:
            - inline
  oneOf:
    - required:
        - label
        - state
    - required:
        - label
        - source
permissionsByProp:
  source.shell:
    - process:execute
  source.file:
    - filesystem:read
  source.http:
    - network:http
  source.process:
    - process:observe
actions:
  - id: refresh
    label: Refresh status
    description: Reload the configured status source.
references:
  source.process:
    resource: process
