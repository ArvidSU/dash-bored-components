schemaVersion: 3
apiVersion: "2.0.0"
id: core/selection
labelProps: [label]
name: Selection container
description: Shows one managed child at a time using core-owned selection
  actions and persisted state.
entry: ./index.tsx
sourceRoot: ..
renderMode: layout
propsSchema:
  type: object
  additionalProperties: false
  properties:
    defaultChild: &a1
      type: string
      minLength: 1
    label: *a1
children:
  defaultChildProp: defaultChild
  min: 1
  presentation:
    type: managed
  metadataSchema:
    type: object
    additionalProperties: false
    properties:
      label: *a1
    required:
      - label
  select: single
