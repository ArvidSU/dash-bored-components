schemaVersion: 4
name: ${projectName}
icon: ./assets/icon.svg
root:
  component: ${package}/group
  children:
    axis: vertical
    first:
      axis: vertical
      first:
        node:
          id: welcome
          component: ${package}/markdown
          props:
            content: |
              # ${projectName}

              This is a starter dashboard in `.dash-bored/`. Creating it changed nothing else in the project and installed nothing. Work through the four steps below to have your coding agent turn it into a cockpit for this project: its commands, checks, docs, and services one click away.

              Each step says what its button does and shows a live check so you can see what happened. Scroll down for a tour of the components, reading this project's real files.
      second:
        node:
          id: get-started
          component: ${package}/group
          props:
            title: Get started
            description: Each step explains its action and shows a live check of the result.
          children:
            axis: vertical
            first:
              axis: vertical
              first:
                node:
                  id: step-trust
                  component: ${package}/group
                  props:
                    title: 1 · Trust this project
                  children:
                    axis: horizontal
                    ratio: 0.5
                    first:
                      node:
                        id: step-trust-guide
                        component: ${package}/markdown
                        props:
                          content: |
                            Until you trust it, this dashboard only renders safe content: text, layout, and YAML-backed panels. Checks, commands, and file reads stay off, which is why the statuses on this page read **unknown**.

                            **When you press Trust project,** a dialog lists every capability this dashboard requests (running commands, reading and writing project files) before anything is enabled. Nothing is installed.

                            **Expect:** *Project trust* turns healthy and the other checks on this page start reporting. Revoke trust at any time from the command palette.
                    second:
                      axis: vertical
                      first:
                        node:
                          id: trust-status
                          component: ${package}/status
                          props:
                            label: Project trust
                            source:
                              shell: "echo '{\"state\":\"healthy\",\"detail\":\"Trusted: checks and commands on this dashboard can run.\"}'"
                              cwd: .
                              timeoutMs: 10000
                      second:
                        node:
                          id: trust-actions
                          component: ${package}/button
                          props:
                            items:
                              - name: Trust project
                                action: project:trust
                              - name: Open settings
                                action: app:show-settings
              second:
                node:
                  id: step-agent
                  component: ${package}/group
                  props:
                    title: 2 · Choose your coding agent
                  children:
                    axis: horizontal
                    ratio: 0.5
                    first:
                      node:
                        id: step-agent-guide
                        component: ${package}/markdown
                        props:
                          content: |
                            Setup is done by a coding agent you already use, through the Agent Client Protocol (ACP). dash-bored recognizes known ACP agents on your PATH, such as Gemini CLI (`gemini --acp`) or Claude Code and Codex through their ACP adapters (`claude-agent-acp`, `codex-acp`), which you install yourself. Sign in through the agent.

                            The agent comes from **Settings → General → Dashboard agent** when that is set; otherwise from the optional `DASH_BORED_AGENT` in this dashboard's `.env`, shown below; otherwise the app uses the first enabled agent. Any other ACP launch command works too.

                            **Expect:** *Agent* reports the command that runs, or that the app uses a detected agent.
                    second:
                      axis: vertical
                      first:
                        node:
                          id: agent-cli-status
                          component: ${package}/status
                          props:
                            label: Agent
                            source:
                              shell: |-
                                esc() { e=$(printf '\033'); printf '%s' "$1" | tr '\n\t' '  ' | sed "s/$e\[[0-9;]*[A-Za-z]//g" | LC_ALL=C tr -d '\000-\037\177' | sed 's/[\\"]/\\&/g'; }
                                agent=$DASH_BORED_AGENT; set -- $agent; program=$1
                                if [ -z "$program" ]; then echo '{"state":"healthy","detail":"No agent set \u2014 the app uses a detected ACP agent. Choose one in Settings to pin it."}'
                                elif found=$(command -v "$program" 2>/dev/null); then printf '{"state":"healthy","detail":"Runs the ACP agent %s (found at %s)."}\n' "$(esc "$agent")" "$(esc "$found")"
                                else printf '{"state":"error","detail":"%s was not found on PATH. Install it, or choose another agent in Settings."}\n' "$(esc "$program")"; fi
                              cwd: .
                              timeoutMs: 10000
                              every: 5000
                      second:
                        node:
                          id: dashboard-environment
                          component: ${package}/env
                          props:
                            path: ${environmentPath}
            second:
              axis: vertical
              first:
                node:
                  id: step-skill
                  component: ${package}/group
                  props:
                    title: 3 · Install the dash-bored skill
                  children:
                    axis: horizontal
                    ratio: 0.5
                    first:
                      node:
                        id: step-skill-guide
                        component: ${package}/markdown
                        props:
                          content: |
                            The skill teaches your agent how dash-bored dashboards are built and ships the tools it uses to inspect, validate, and screenshot them. Nothing is installed until you run one of the commands. One install is enough.

                            - **Globally** writes `~/.agents/skills/dash-bored/` and links `~/.claude/skills/dash-bored`, for every project on this Mac.
                            - **For this project** writes `.agents/skills/dash-bored/` and links `.claude/skills/dash-bored` in this folder, so you can commit it for your team.

                            **Expect:** the terminal prints where it installed, and the matching status turns healthy within a few seconds. The commands stay here so you can reinstall any time. Afterwards the app refreshes installed skills when it updates and keeps your local edits.
                    second:
                      axis: vertical
                      first:
                        axis: vertical
                        first:
                          node:
                            id: skill-global-status
                            component: ${package}/status
                            props:
                              label: Skill · global
                              source:
                                shell: |-
                                  esc() { e=$(printf '\033'); printf '%s' "$1" | tr '\n\t' '  ' | sed "s/$e\[[0-9;]*[A-Za-z]//g" | LC_ALL=C tr -d '\000-\037\177' | sed 's/[\\"]/\\&/g'; }
                                  if [ -z "$DASH_BORED_TOOL" ]; then echo '{"state":"error","detail":"This app build does not publish its agent tool (DASH_BORED_TOOL is unset)."}'; exit 0; fi
                                  if out=$(FORCE_COLOR=0 "$DASH_BORED_TOOL" install-skill --global --check 2>&1); then echo '{"state":"healthy","detail":"Installed in ~/.agents/skills/dash-bored, linked from ~/.claude/skills/dash-bored."}'; else printf '{"state":"warning","detail":"Not installed yet: %s"}\n' "$(esc "$(printf '%s' "$out" | head -n 1)")"; fi
                                cwd: .
                                timeoutMs: 10000
                                every: 5000
                        second:
                          node:
                            id: skill-project-status
                            component: ${package}/status
                            props:
                              label: Skill · this project
                              source:
                                shell: |-
                                  esc() { e=$(printf '\033'); printf '%s' "$1" | tr '\n\t' '  ' | sed "s/$e\[[0-9;]*[A-Za-z]//g" | LC_ALL=C tr -d '\000-\037\177' | sed 's/[\\"]/\\&/g'; }
                                  if [ -z "$DASH_BORED_TOOL" ]; then echo '{"state":"error","detail":"This app build does not publish its agent tool (DASH_BORED_TOOL is unset)."}'; exit 0; fi
                                  if out=$(FORCE_COLOR=0 "$DASH_BORED_TOOL" install-skill . --check 2>&1); then echo '{"state":"healthy","detail":"Installed in .agents/skills/dash-bored, linked from .claude/skills/dash-bored."}'; else printf '{"state":"warning","detail":"Not installed yet: %s"}\n' "$(esc "$(printf '%s' "$out" | head -n 1)")"; fi
                                cwd: .
                                timeoutMs: 10000
                                every: 5000
                      second:
                        axis: vertical
                        first:
                          node:
                            id: install-dash-bored-global-skill
                            component: ${package}/command
                            props:
                              label: Install skill globally
                              command: '"$DASH_BORED_TOOL" install-skill --global'
                              cwd: .
                        second:
                          node:
                            id: install-dash-bored-skill
                            component: ${package}/command
                            props:
                              label: Install skill for this project
                              command: '"$DASH_BORED_TOOL" install-skill .'
                              cwd: .
              second:
                node:
                  id: step-setup
                  component: ${package}/group
                  props:
                    title: 4 · Let the agent build your cockpit
                  children:
                    axis: horizontal
                    ratio: 0.5
                    first:
                      node:
                        id: step-setup-guide
                        component: ${package}/markdown
                        props:
                          content: |
                            **When you press Set up this dashboard:**

                            1. A review dialog shows the agent and the exact prompt. Nothing runs until you press **Send**.
                            2. The agent works under **Agent work** in the header: its messages, plan, and tool calls appear there, and so do its permission requests, which you answer.
                            3. It inspects this project and rewrites this dashboard's `dash-bored.yaml` into a project-specific cockpit with a custom sidebar icon. **This starter page is replaced.** Files outside the dashboard bundle are not part of the task.
                            4. When the agent finishes its turn, dash-bored validates the result and, if it finds configuration errors, asks the agent once, in the same session, to repair them. You can send follow-ups until you close the session.

                            **Expect** this to take several minutes. Validation proves the YAML is correct, not that the panels are useful, so review the result. If the new dashboard requests more capabilities, trust the project again.
                    second:
                      node:
                        id: setup-dashboard-with-agent
                        component: ${package}/button
                        props:
                          name: Set up this dashboard
                          action:
                            run: agent:prompt
                            with:
                              prompt: "Set up the dash-bored dashboard for ${projectName}. Use the installed dash-bored skill for product-specific guidance. Its agent tool is \"$DASH_BORED_TOOL\" (also reachable as the skill's scripts/dash-bored launcher). Inspect this project before making changes; use \"$DASH_BORED_TOOL\" inspect . --summary, then --component <reference> for selected contracts. Customize the owning dashboard configuration into a useful project cockpit, preserving unrelated dashboards and files. Keep the dashboard project-owned and task-focused: every tab should explain what its panels do, demonstrate live status where possible, and expose the repeatable actions. Prefer the pinned core components when they fit. When no catalog component directly matches a project need, first see whether an existing built-in view (status, list, chart, or markdown) can present the data from a small, bounded source script, with item actions or agent:prompt for follow-up work. Build a project-local component only when no existing view can present the needed interaction or visualization. The dashboard belongs to the project: never include explanations of the dash-bored app itself, its onboarding, or its concepts in the finished dashboard content. If the dash-bored skill is not installed for your agent, run \"$DASH_BORED_TOOL\" install-skill . and read it before composing. Generate a small SVG icon customized for this project: write it to assets/icon.svg inside the owning bundle directory (next to that dash-bored.yaml), creating the directory if needed, and set that file's top-level icon to ./assets/icon.svg. Keep the artwork simple and geometric so it stays readable at sidebar size, with no scripts or external references. Follow AGENTS.md and the project's own instructions, preserve unrelated changes and validate the finished dashboard, then check it visually with the tool's app screenshot command."
    second:
      node:
        id: tour
        component: ${package}/group
        props:
          title: Tour the components
          description: Each tab explains one component, shows it working on this project, and suggests something to try.
        children:
          axis: vertical
          first:
            node:
              id: tour-tabs
              component: ${package}/button
              props:
                variant: tabs
                label: Component tour
                items:
                  - name: Status
                    action: select:tour-panels/tour-status
                  - name: List
                    action: select:tour-panels/tour-list
                  - name: Chart
                    action: select:tour-panels/tour-chart
                  - name: Markdown
                    action: select:tour-panels/tour-markdown
                  - name: Command
                    action: select:tour-panels/tour-command
                  - name: Todos
                    action: select:tour-panels/tour-todos
                  - name: Layout & editing
                    action: select:tour-panels/tour-layout
          second:
            node:
              id: tour-panels
              component: ${package}/selection
              props:
                defaultChild: tour-status
                label: Component tour
              children:
                - metadata:
                    label: Status
                  node:
                    id: tour-status
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-status-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Status
                              A labeled state (healthy, warning, error, or unknown) read from a source such as a shell command, file, or URL. Use it for “is it running?” questions.

                              The status beside this text counts this project's files by when they last changed. Its detail and bar come from a small shell command that prints `{ state, detail, segments }`.

                              **Try it:** save any file in the project and wait about ten seconds: the counts move and the status marks what changed. Open the panel menu and choose **Edit component** to read the command.
                      second:
                        node:
                          id: tour-activity-status
                          component: ${package}/status
                          props:
                            label: Project activity
                            source:
                              shell: |-
                                files() { if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then git ls-files -z --cached --others --exclude-standard; else find . -mindepth 1 \( -name '.*' -o -name node_modules \) -prune -o -type f -print0; fi; }
                                count() { files | xargs -0 sh -c 'find "$@" -prune -type f '"$1"' -print' sh 2>/dev/null | wc -l | tr -d ' '; }
                                all=$(count ""); day=$(count "-mtime -1"); week=$(($(count "-mtime -7") - day)); older=$((all - day - week))
                                if [ "$all" -eq 0 ]; then echo '{"state":"unknown","detail":"No project files found yet."}'; exit 0; fi
                                if [ $((day + week)) -gt 0 ]; then state=healthy; detail="$day changed today, $week earlier this week, $older older."; else state=warning; detail="No file changes in the last 7 days."; fi
                                printf '{"state":"%s","detail":"%s","segments":[{"label":"Today","value":%s,"state":"healthy"},{"label":"This week","value":%s},{"label":"Older","value":%s,"state":"unknown"}]}\n' "$state" "$detail" "$day" "$week" "$older"
                              cwd: .
                              timeoutMs: 10000
                              every: 10000
                - metadata:
                    label: List
                  node:
                    id: tour-list
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-list-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### List
                              Items with stable IDs from a source, with tags to filter and per-item actions. Use it for work queues, recent changes, or runnable scripts.

                              This list shows the most recently modified files in this project. Items that appear or change between refreshes are marked.

                              **Try it:** press **Details** on a file. The command panel below runs with that file as `$DASH_ITEM_PATH` and prints its size, type, and first lines. Choose a tag to filter by file type.
                      second:
                        axis: vertical
                        first:
                          node:
                            id: tour-recent-files
                            component: ${package}/list
                            props:
                              title: Recently modified files
                              sort: source-order
                              source:
                                shell: |-
                                  files() { if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then git ls-files -z --cached --others --exclude-standard; else find . -mindepth 1 \( -name '.*' -o -name node_modules \) -prune -o -type f -print0; fi; }
                                  files | xargs -0 ls -td -- 2>/dev/null | head -n 12 | awk 'function q(s){gsub(/\\/,"\\\\",s);gsub(/"/,"\\\"",s);gsub(/\t/,"\\t",s);return "\"" s "\""} BEGIN{printf "["} {p=$0; sub(/^\.\//,"",p); n=split(p,a,"/"); name=a[n]; dir=(n>1)?substr(p,1,length(p)-length(name)-1):"."; ext="no extension"; if (match(name,/\.[^.]+$/) && RSTART>1) ext=substr(name,RSTART); printf "%s{\"id\":%s,\"title\":%s,\"detail\":%s,\"tags\":[%s],\"path\":%s}", (NR>1?",":""), q(p), q(name), q(dir), q(ext), q(p)} END{print "]"}'
                                cwd: .
                                timeoutMs: 10000
                                every: 15000
                              itemActions:
                                - name: Details
                                  action:
                                    run: component:tour-file-details:run
                                    with:
                                      path: ${item.path}
                        second:
                          node:
                            id: tour-file-details
                            component: ${package}/command
                            props:
                              label: Show the selected file
                              command: ls -l -- "$DASH_ITEM_PATH" && file -b -- "$DASH_ITEM_PATH" && case "$(file -b --mime-type -- "$DASH_ITEM_PATH")" in text/*) echo && head -n 40 -- "$DASH_ITEM_PATH";; esac
                              cwd: .
                - metadata:
                    label: Chart
                  node:
                    id: tour-chart
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-chart-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Chart
                              Line or bar charts from inline YAML or a source that prints `{ labels, series }`. Use it for trends such as build times, test counts, or traffic.

                              This chart counts this project's files by extension. Inside a Git work tree it follows your ignore rules; elsewhere it skips hidden folders and `node_modules`.

                              **Try it:** hover a bar for its value. Add a few files and press **Refresh** from the command palette.
                      second:
                        node:
                          id: tour-file-types
                          component: ${package}/chart
                          props:
                            title: Files by type
                            type: bar
                            source:
                              shell: |-
                                files() { if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then git ls-files -z --cached --others --exclude-standard; else find . -mindepth 1 \( -name '.*' -o -name node_modules \) -prune -o -type f -print0; fi; }
                                files | tr '\0' '\n' | awk -F/ '{n=$NF; e="no extension"; if (match(n,/\.[^.]+$/) && RSTART>1) e=substr(n,RSTART); c[e]++} END{for (e in c) print c[e] "\t" e}' | sort -rn | head -n 8 | awk -F'\t' 'function q(s){gsub(/\\/,"\\\\",s);gsub(/"/,"\\\"",s);gsub(/\t/,"\\t",s);return "\"" s "\""} {l=l (NR>1?",":"") q($2); v=v (NR>1?",":"") $1} END{printf "{\"labels\":[%s],\"series\":[{\"label\":\"Files\",\"values\":[%s]}]}\n", l, v}'
                              cwd: .
                              timeoutMs: 10000
                              every: 60000
                - metadata:
                    label: Markdown
                  node:
                    id: tour-markdown
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-markdown-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Markdown
                              Safe Markdown from inline YAML, a project file, or a command's output. Use it for runbooks, READMEs, and generated reports.

                              The panel beside this text renders this project's `README.md`, read fresh each time the tab opens.

                              **Try it:** edit `README.md` and switch tabs to reload it. A Markdown panel pointed at a file with `path:` can also be edited and saved in place.
                      second:
                        node:
                          id: tour-readme
                          component: ${package}/markdown
                          props:
                            title: README.md
                            source:
                              shell: if [ -f README.md ]; then head -c 60000 README.md; else printf '%s\n\n' '### No README.md yet' 'This panel renders README.md from the project root once it exists. Until then, here are the top-level entries:'; ls -1p | head -n 30 | sed 's/^/- /'; fi
                              cwd: .
                              timeoutMs: 5000
                - metadata:
                    label: Command
                  node:
                    id: tour-command
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-command-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Command
                              A remembered command with a persistent terminal. Use it for dev servers, tests, builds, and deploys. It keeps running while you switch tabs and dashboards.

                              **Try it:** run the command beside this text to list this folder. Run and stop commands from the command palette (**Command-K**, then type the command's name), or bind them to a keyboard shortcut in **Settings → Actions**.
                      second:
                        node:
                          id: tour-list-folder
                          component: ${package}/command
                          props:
                            label: List this project folder
                            command: ls -la
                            cwd: .
                - metadata:
                    label: Todos
                  node:
                    id: tour-todos
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-todos-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Todos
                              A list whose items live in this dashboard's YAML, so they travel with the project and show up in code review.

                              **Try it:** tick an item. dash-bored opens a draft; press **Save dashboard** to write the change to `dash-bored.yaml`, or **Cancel** to discard it.
                      second:
                        node:
                          id: tour-ideas
                          component: ${package}/list
                          props:
                            title: Ideas for this dashboard
                            todos:
                              - id: idea-dev-server
                                description: Add a command that starts the dev server
                                done: false
                                tags:
                                  - act
                              - id: idea-tests
                                description: Add a status that runs the test suite on demand
                                done: false
                                tags:
                                  - observe
                              - id: idea-docs
                                description: Link the project's runbook or docs with a Markdown panel
                                done: false
                                tags:
                                  - overview
                              - id: idea-local-ui
                                description: Embed a local web UI with a webview
                                done: false
                                tags:
                                  - observe
                - metadata:
                    label: Layout & editing
                  node:
                    id: tour-layout
                    component: ${package}/group
                    children:
                      axis: horizontal
                      ratio: 0.4
                      first:
                        node:
                          id: tour-layout-guide
                          component: ${package}/markdown
                          props:
                            content: |
                              ### Layout & editing
                              Everything on this page is one YAML tree in `.dash-bored/dash-bored.yaml`: groups with titles, horizontal and vertical splits, and switchable panels like this tab bar (an action bar selecting a child of a selection container).

                              Four ways to change it, all through the same draft that you Save or Cancel:

                              - **Component library**: add, move, and remove components and fill in their props.
                              - **Panel menu** (right-click a panel): Edit component, Focus, Collapse, Copy component path, or **Change with agent** to describe a change in words.
                              - **Command-K**: search every app, dashboard, and component action.
                              - **Your agent**: edit the YAML directly with the skill's tools.

                              **Try it:** open the component library, or right-click this panel.
                      second:
                        node:
                          id: tour-layout-actions
                          component: ${package}/button
                          props:
                            items:
                              - name: Open component library
                                action: project:edit
                              - name: Focus a component
                                action: project:focus
