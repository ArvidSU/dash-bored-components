schemaVersion: 3
apiVersion: "1.0.0"
id: core/list
name: List
description: Renders stable-ID items from a bounded source or editable YAML
  todos. Source items that are new or changed in the latest differing
  observation are marked.
entry: ./index.js
types: ./index.d.ts
propsSchema:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
    source:
      type: object
      additionalProperties: false
      properties:
        shell: &a1
          type: string
          minLength: 1
        file: *a1
        http:
          type: string
          pattern: ^https?://
        process: *a1
        inline: {}
        every:
          type: integer
          minimum: 1000
          maximum: 300000
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
        cwd:
          type: string
          minLength: 1
        env:
          type: object
          additionalProperties:
            type: string
      oneOf:
        - required:
            - shell
        - required:
            - file
        - required:
            - http
        - required:
            - process
        - required:
            - inline
    todos:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        properties:
          id: *a1
          description: *a1
          done:
            type: boolean
          tags:
            type: array
            maxItems: 32
            items: *a1
        required:
          - id
          - description
          - done
          - tags
    filterByTags:
      type: boolean
      default: true
    sort:
      enum:
        - open-first
        - source-order
      default: open-first
    highlightChanges:
      type: boolean
      default: true
    itemActions:
      type: array
      maxItems: 12
      items:
        type: object
        additionalProperties: false
        properties:
          name: *a1
          action:
            oneOf:
              - type: string
                minLength: 1
                format: action-reference
              - type: object
                additionalProperties: false
                properties:
                  run:
                    type: string
                    minLength: 1
                    format: action-reference
                  with:
                    type: object
                required:
                  - run
        required:
          - name
          - action
  oneOf:
    - required:
        - source
    - required:
        - todos
actions:
  - id: refresh
    label: Refresh list
  - id: toggle
    label: Toggle todo completion
    args:
      type: object
      additionalProperties: false
      properties:
        id: *a1
  - id: remove
    label: Remove todo
    args:
      type: object
      additionalProperties: false
      properties:
        id: *a1
  - id: filter
    label: Filter list by tag
    args:
      type: object
      additionalProperties: false
      properties:
        tag: *a1
  - id: clear-filter
    label: Clear list tag filter
permissionsByProp:
  source.shell:
    - process:execute
  source.file:
    - filesystem:read
  source.http:
    - network:http
  source.process:
    - process:observe
references:
  source.process:
    resource: process
  itemActions.*.action:
    resource: action
