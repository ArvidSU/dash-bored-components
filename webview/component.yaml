schemaVersion: 3
apiVersion: "2.0.0"
id: core/webview
name: Webview
description: Embeds an HTTP or HTTPS application page.
entry: ./index.tsx
sourceRoot: ..
actions:
  - id: reload
    label: Reload embedded page
propsSchema:
  type: object
  additionalProperties: false
  properties:
    url:
      type: string
      pattern: ^https?://
  required:
    - url
permissions:
  - webview:embed
